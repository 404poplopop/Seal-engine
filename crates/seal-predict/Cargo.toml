[package]
name = "seal-predict"
description = "Prediction and speculation: proven closed forms, a timing wheel, stride predictors, the cost model, spare-capacity speculation and optimistic batches."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true

[dependencies]
seal-kernel = { path = "../seal-kernel" }
seal-jobs = { path = "../seal-jobs" }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading"] }
