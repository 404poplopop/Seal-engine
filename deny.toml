[advisories]
yanked = "warn"
unmaintained = "workspace"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "BSL-1.0",
    "0BSD",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    # Permissive, not copyleft: a build-time target parser and the CA root list.
    "Apache-2.0 WITH LLVM-exception",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# The ASTC encoder fork Seal builds (see the patch in Cargo.toml).
allow-git = ["https://github.com/404poplopop/intel-tex-rs-2"]
